# Dograh — Coolify (Docker Compose) deployment
# =================================================================
# Backend stack only: postgres, redis, minio, coturn, api.
# The UI is intentionally NOT here — develop it locally with `npm run dev`
# against this deployed API, or add it back later.
#
# Built for Coolify's own Traefik proxy:
#   - No bundled nginx and no dograh-init renderer. Coolify's Traefik is the
#     ingress; we attach routing intent via labels and Coolify routes traffic.
#   - Images are BUILT FROM SOURCE (repo Dockerfiles) so each deploy runs the
#     code on the tracked branch — including the pipecat git submodule.
#   - Web tier publishes NO host ports — Coolify's Traefik reaches containers
#     over the `coolify` network. coturn is the ONLY service that binds host
#     ports, because WebRTC media is UDP and CANNOT traverse an HTTP proxy.
#   - The `traefik` network is declared external but NOT created here. Coolify
#     attaches every compose service to its own `coolify` network at deploy
#     time, so `traefik.enable=true` labels are picked up regardless.
#
# Coolify resource settings (one-time):
#   - Build Pack: docker-compose
#   - Compose file: deploy/coolify/docker-compose.yaml
#   - Base directory: ./            (repo root — the build contexts need pipecat/)
#   - Git: public repo ramananbuilds/dograh, branch: deploy
#   - "Pull submodules": ON         (api build binds pipecat/)
#
# Required env (Coolify env panel) — see .env.example:
#   PUBLIC_HOST, TURN_HOST, TURN_SECRET, OSS_JWT_SECRET,
#   POSTGRES_PASSWORD, REDIS_PASSWORD, MINIO_ROOT_USER, MINIO_ROOT_PASSWORD,
#   TRAEFIK_NETWORK, TRAEFIK_CERTRESOLVER, TRAEFIK_ENTRYPOINT
# =================================================================

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: postgres
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # No host port: Postgres is reachable only inside app-network.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  redis:
    image: redis:7
    restart: unless-stopped
    command: >
      --requirepass ${REDIS_PASSWORD:-redissecret}
    # No host port: Redis is reachable only inside app-network.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redissecret}", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10
    networks:
      - app-network

  minio:
    # Built from the community MinIO fork by github.com/dograh-hq/minio; upstream
    # MinIO no longer publishes images.
    image: ${REGISTRY:-dograhai}/minio:2026.09.22
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    # No host ports. Browsers fetch audio via Coolify's Traefik at
    # https://${PUBLIC_HOST}/voice-audio/... (objects are public-read).
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-coolify}"
      # Audio file downloads. Highest priority so it wins over the API catch-all.
      - "traefik.http.routers.dograh-audio.rule=Host(`${PUBLIC_HOST}`) && PathPrefix(`/voice-audio`)"
      - "traefik.http.routers.dograh-audio.entrypoints=${TRAEFIK_ENTRYPOINT:-https}"
      - "traefik.http.routers.dograh-audio.tls=true"
      - "traefik.http.routers.dograh-audio.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.dograh-audio.priority=20"
      - "traefik.http.services.dograh-audio.loadbalancer.server.port=9000"
    networks:
      - app-network
      # Reachable by Coolify's Traefik proxy for /voice-audio downloads.
      - traefik

  # TURN/STUN relay for WebRTC NAT traversal. This is the voice media path —
  # it is UDP and is NOT, and cannot be, proxied by Traefik. These host ports
  # MUST be published and opened in the VPS firewall, and TURN_HOST must be the
  # server public IP (or a domain resolving to it). Without this, calls connect
  # (signaling succeeds over Traefik) but carry NO audio.
  #
  # Configured entirely from CLI flags (`-n` disables config-file lookup), so
  # the stack ships no host-side config and needs no init/renderer container.
  coturn:
    image: coturn/coturn:4.8.0
    container_name: coturn
    restart: unless-stopped
    command:
      - -n
      - "--listening-port=3478"
      - "--tls-listening-port=5349"
      - "--min-port=49152"
      - "--max-port=49200"
      - "--external-ip=${TURN_HOST}"
      - "--realm=dograh.com"
      - --use-auth-secret
      - "--static-auth-secret=${TURN_SECRET}"
      - --fingerprint
      - --no-cli
      - --no-multicast-peers
      - "--log-file=stdout"
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/udp"
      - "5349:5349/tcp"
      - "49152-49200:49152-49200/udp"
    networks:
      - app-network

  api:
    build:
      # Context is the repo root, relative to THIS compose file (deploy/coolify/).
      # Coolify sets base directory to the repo root and reads this file from
      # deploy/coolify/, so ../.. resolves to the checkout root where api/ and
      # pipecat/ live.
      context: ../..
      dockerfile: api/Dockerfile
    image: dograh-api:latest
    restart: unless-stopped
    environment:
      # production => drop private-IP host ICE candidates on a public VPS and
      # order TURN URIs UDP-first. Required for correct remote WebRTC.
      ENVIRONMENT: "production"
      LOG_LEVEL: "INFO"

      # Public HTTPS origin (Coolify Traefik-terminated). Used for absolute URLs
      # and for verifying inbound telephony webhook signatures.
      BACKEND_API_ENDPOINT: "https://${PUBLIC_HOST}"

      DATABASE_URL: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/postgres"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redissecret}@redis:6379"

      ENABLE_AWS_S3: "false"
      MINIO_ENDPOINT: "minio:9000"
      # Full public URL browsers use to fetch audio. Traefik routes
      # /voice-audio/ to minio:9000.
      MINIO_PUBLIC_ENDPOINT: "https://${PUBLIC_HOST}"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      MINIO_BUCKET: "voice-audio"
      MINIO_SECURE: "false"

      # IMPORTANT: pinned to 1. The image launches FASTAPI_WORKERS as
      # independent uvicorn processes on consecutive ports (8000, 8001, ...)
      # expecting the bundled nginx to least_conn-balance long-lived WebSockets
      # across them. We dropped that nginx for Coolify's Traefik, and Traefik
      # can only target one port — so values >1 leave extra workers idle. The
      # container also runs singletons (telephony ARI manager, campaign
      # orchestrator) + migrations that must run exactly once. Scale vertically.
      FASTAPI_WORKERS: "1"

      # Trust Traefik's X-Forwarded-Proto: https so request.url is https and
      # inbound webhook signature checks pass.
      FORWARDED_ALLOW_IPS: "*"

      # TURN — must match coturn. TURN_HOST is the server public IP / TURN domain.
      # This stack always runs coturn, so TURN is unconditionally enabled.
      ENABLE_COTURN: "true"
      TURN_HOST: "${TURN_HOST:?TURN_HOST is required for WebRTC media}"
      TURN_SECRET: "${TURN_SECRET:?TURN_SECRET is required for WebRTC media}"
      FORCE_TURN_RELAY: "${FORCE_TURN_RELAY:-false}"

      OSS_JWT_SECRET: "${OSS_JWT_SECRET:?OSS_JWT_SECRET must be set to a strong secret}"

      ENABLE_TELEMETRY: "${ENABLE_TELEMETRY:-true}"
      POSTHOG_API_KEY: "phc_ItizB1dP6yv7ZYobbcqrpxTdbomDA8hJFSEmAMdYvIr"
      POSTHOG_HOST: "https://us.i.posthog.com"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/api/v1/health'').read()"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-coolify}"
      # REST API + the signaling WebSocket (/api/v1/ws/signaling/...).
      # Traefik upgrades WebSockets automatically — no extra labels needed.
      - "traefik.http.routers.dograh-api.rule=Host(`${PUBLIC_HOST}`) && PathPrefix(`/api/v1`)"
      - "traefik.http.routers.dograh-api.entrypoints=${TRAEFIK_ENTRYPOINT:-https}"
      - "traefik.http.routers.dograh-api.tls=true"
      - "traefik.http.routers.dograh-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.dograh-api.priority=10"
      - "traefik.http.services.dograh-api.loadbalancer.server.port=8000"
    networks:
      - app-network
      # Coolify's Traefik proxy is attached to this network; the labels above
      # only take effect if the container is reachable on it.
      - traefik

volumes:
  postgres_data:
  redis_data:
  minio-data:
    driver: local

networks:
  # Internal network for service-to-service traffic (db, redis, minio, coturn).
  app-network:
    driver: bridge
  # Coolify attaches every compose service to its own `coolify` network at
  # deploy time; this declaration only satisfies compose's interpolation of
  # ${TRAEFIK_NETWORK}. It is NOT created by this file.
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-coolify}