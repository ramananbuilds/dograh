<!doctype html>
<html lang="en" class="dark" style="background-color: #090a0c; color: #fafafa;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dograh Console — Conversational Voice AI</title>
    <style>
      html, body {
        background-color: #090a0c !important;
        color: #fafafa !important;
        margin: 0;
        padding: 0;
      }
    </style>
    <script>
      window.addEventListener('error', function(event) {
        console.error('Captured window error:', event.error || event.message);
        var root = document.getElementById('root');
        if (root && (!root.childNodes || root.childNodes.length === 0)) {
          root.innerHTML = '<div style="background:#090a0c;color:#f87171;padding:32px;font-family:sans-serif;min-height:100vh;">' +
            '<h2 style="color:#ef4444;font-size:18px;margin-bottom:8px;">Application Initialization Error</h2>' +
            '<pre style="background:#18181b;padding:16px;border-radius:12px;border:1px solid #27272a;color:#fca5a5;font-size:12px;overflow:auto;">' +
            (event.error ? (event.error.stack || event.error.message) : event.message) +
            '</pre></div>';
        }
      });
    </script>
  </head>
  <body class="min-h-screen bg-[#090a0c] text-zinc-100 font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
